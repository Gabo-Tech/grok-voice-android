pluginManagement {
    repositories {
        // GitHub-hosted runners intermittently fail to resolve this plugin from
        // plugins.gradle.org and report it as missing. The jars are the published
        // 6.6.4 release that Gradle 9.6.1 asks for.
        maven { url = uri("${rootDir}/repo") }
        // Maven Central answers GitHub-hosted runners with 429 often enough to
        // fail the buildSrc classpath. This mirror publishes the same artifacts.
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = uri("${rootDir}/repo") }
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}
